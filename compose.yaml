name: openroboops

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openroboops
      POSTGRES_USER: openroboops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openroboops -d openroboops"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && openroboops-api"]
    environment:
      OPENROBOOPS_ENVIRONMENT: production
      OPENROBOOPS_DATABASE_URL: postgresql+asyncpg://openroboops:${POSTGRES_PASSWORD}@postgres:5432/openroboops
      OPENROBOOPS_COOKIE_SECURE: "true"
      OPENROBOOPS_ALLOWED_ORIGINS: ${OPENROBOOPS_SITE_ADDRESS:-https://localhost}
      OPENROBOOPS_DATA_ROOT: /data/episodes
      OPENROBOOPS_SEED_SIMULATOR: ${OPENROBOOPS_SEED_SIMULATOR:-true}
    volumes:
      - ${OPENROBOOPS_DATA_ROOT_HOST:-./data}:/data/episodes
      - ${OPENROBOOPS_SECRETS_HOST:-./runtime-secrets}:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    command: ["openroboops-worker"]
    environment:
      OPENROBOOPS_ENVIRONMENT: production
      OPENROBOOPS_DATABASE_URL: postgresql+asyncpg://openroboops:${POSTGRES_PASSWORD}@postgres:5432/openroboops
      OPENROBOOPS_DATA_ROOT: /data/episodes
      OPENROBOOPS_SEED_SIMULATOR: ${OPENROBOOPS_SEED_SIMULATOR:-true}
    volumes:
      - ${OPENROBOOPS_DATA_ROOT_HOST:-./data}:/data/episodes
      - ${OPENROBOOPS_SECRETS_HOST:-./runtime-secrets}:/run/secrets:ro
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: public.ecr.aws/docker/library/caddy:2.10-alpine
    restart: unless-stopped
    environment:
      OPENROBOOPS_SITE_ADDRESS: ${OPENROBOOPS_SITE_ADDRESS:-https://localhost}
      OPENROBOOPS_SITE_HOST: ${OPENROBOOPS_SITE_HOST:-localhost}
    ports:
      - ${OPENROBOOPS_HTTP_PORT:-8080}:80
      - ${OPENROBOOPS_HTTPS_PORT:-8443}:443
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
